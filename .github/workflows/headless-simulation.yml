name: Headless Simulation Test

on:
  push:
    branches: [ main, docker, zed_node_update ]

  workflow_dispatch:

jobs:
  test-headless-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: rumarino-headless:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker

    - name: Run volumetric trigger tests (5 runs for flakiness detection)
      run: |
        TOTAL_RUNS=5
        PASSED=0
        FAILED=0

        for i in $(seq 1 $TOTAL_RUNS); do
          echo "============================================"
          echo "  RUN $i / $TOTAL_RUNS"
          echo "============================================"

          if docker run --rm \
            --name "headless-test-$i" \
            rumarino-headless:latest \
            bash -c "
              source /opt/ros/jazzy/setup.bash && \
              source /ros2_ws/install/setup.bash && \
              timeout 60 ros2 launch bringup test_volume_triggers.launch.py \
                mission_name:=prequalify \
                env_file_name:=hydrus_env_headless.scn
            "; then
            echo "RUN $i: PASSED"
            PASSED=$((PASSED + 1))
          else
            echo "RUN $i: FAILED"
            FAILED=$((FAILED + 1))
          fi
        done

        echo ""
        echo "============================================"
        echo "  RESULTS: $PASSED/$TOTAL_RUNS passed, $FAILED/$TOTAL_RUNS failed"
        echo "============================================"

        if [ $FAILED -gt 0 ]; then
          if [ $PASSED -gt 0 ]; then
            echo "WARNING: Flaky test detected ($FAILED/$TOTAL_RUNS failures)"
          fi
          exit 1
        fi
