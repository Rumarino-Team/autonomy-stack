# this config file is watched by mission_executor
# so you can change it without having to re-launch
#
# Example:
# ```
# [<auv_name>]
# tam = [
#    [ x, y, z, roll, pitch, yaw ]
#    ... a row for each thrustor
# ]
# [<auv_name>.<bridge_name_1>]
# kp = [ x, y, z, roll, pitch, yaw ]
# ki = [ x, y, z, roll, pitch, yaw ]
# kd = [ x, y, z, roll, pitch, yaw ]
# 
# [<auv_name>.<bridge_name_2>]
# kp = [ x, y, z, roll, pitch, yaw ]
# ki = [ x, y, z, roll, pitch, yaw ]
# kd = [ x, y, z, roll, pitch, yaw ]
# ```

[hydrus]
